name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every workspace, not just the kernel. `test:kernel` left the ext
      # (851), perspective (219), data (137) and lab (305) suites ungated —
      # 1,512 tests that no merge had to pass. Turbo runs them in parallel:
      # the whole set is ~24s wall, so there was never a cost argument for
      # the narrower gate.
      - name: Tests
        run: npm test

  # Keep demo Vite boot paths honest on Windows (path separators, npm.cmd,
  # process trees). Self-contained demos only — no sibling starui STOMP.
  demos-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify demos boot
        run: npm run verify:demos -- --only velocitygrid-showcase,velocitygrid-ssrm-demo,colgroups,showcase
