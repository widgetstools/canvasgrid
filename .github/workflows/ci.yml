name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every workspace, not just the kernel. `test:kernel` left the ext
      # (851), perspective (219), data (137) and lab (305) suites ungated —
      # 1,512 tests that no merge had to pass. Turbo runs them in parallel:
      # the whole set is ~24s wall, so there was never a cost argument for
      # the narrower gate.
      - name: Tests
        run: npm test

  # Canvas features fail by PAINTING SOMETHING WRONG, which unit tests cannot
  # see. Three defects in the dshub demo alone — blank group captions, every
  # formatted cell empty, a weighted average missing from the rows that needed
  # it — rendered as plausible numbers and were caught by a human looking at a
  # screenshot. That is not a gate.
  #
  # This runs the specs that need NOTHING but this repo; `playwright.config.ts`
  # starts their servers. The provider-demo specs need the STOMP fixture and a
  # broker port, so they stay a local run rather than leaving the whole suite
  # red and therefore ignored.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The demos import the kernel from dist, not src.
      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: E2E (self-contained demos)
        run: npm run test:e2e:selfcontained

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  # Keep demo Vite boot paths honest on Windows (path separators, npm.cmd,
  # process trees). Self-contained demos only — no sibling starui STOMP.
  demos-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify demos boot
        run: npm run verify:demos -- --only velocitygrid-showcase,velocitygrid-ssrm-demo,colgroups,showcase
