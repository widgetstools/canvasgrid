<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StompPerspectiveProvider — playground</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23b07d10'/%3E%3Cpath d='M3 5h10M3 8h10M3 11h6' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E" />
    <style>
      html, body { height: 100%; margin: 0; background: #101318; }
      body { display: flex; flex-direction: column; font: 12px/1.4 system-ui, sans-serif; color: #c9d3de; }
      .cfg { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding: 10px 14px; border-bottom: 1px solid #232a33; }
      .cfg .field { display: flex; flex-direction: column; gap: 3px; }
      .cfg label { color: #8a96a5; font-size: 11px; }
      .cfg input, .cfg select {
        background: #171c23; color: #dfe6ee; border: 1px solid #2c3540; border-radius: 4px;
        padding: 4px 7px; font: inherit; min-width: 72px;
      }
      .cfg input:disabled { opacity: 0.45; }
      .cfg input.wide { min-width: 170px; }
      .cfg input.filter { min-width: 230px; }
      .cfg input.invalid { border-color: #b8433c; }
      .cfg button {
        background: #2d6cdf; color: white; border: 0; border-radius: 4px;
        padding: 6px 16px; font: inherit; font-weight: 600; cursor: pointer;
      }
      .cfg button:hover { background: #3a7af0; }
      .status { display: flex; gap: 16px; padding: 6px 14px; border-bottom: 1px solid #232a33; color: #8a96a5; }
      .status b { color: #dfe6ee; font-weight: 600; }
      .status .ok b { color: #4fc487; }
      .status .err b { color: #e2695f; }
      .hint { margin-left: auto; color: #5d6875; }
      #grid { flex: 1 1 auto; min-height: 0; }
    </style>
  </head>
  <body>
    <form class="cfg" id="cfg">
      <div class="field"><label for="feed">feed</label>
        <select id="feed" name="feed"><option value="seed" selected>seed</option><option value="stomp">stomp</option></select></div>
      <div class="field"><label for="wsUrl">wsUrl</label>
        <input id="wsUrl" name="wsUrl" class="wide" value="ws://localhost:8081" disabled /></div>
      <div class="field"><label for="clientId">clientId</label>
        <input id="clientId" name="clientId" value="playground" disabled /></div>
      <div class="field"><label for="snapshotRows">snapshotRows</label>
        <input id="snapshotRows" name="snapshotRows" type="number" min="100" step="100" value="10000" /></div>
      <div class="field"><label for="rate">rate (ticks/s)</label>
        <input id="rate" name="rate" type="number" min="1" max="240" value="40" /></div>
      <div class="field"><label for="batchSize">batchSize</label>
        <input id="batchSize" name="batchSize" type="number" min="1" value="50" /></div>
      <div class="field"><label for="updatesPerTick">updatesPerTick</label>
        <input id="updatesPerTick" name="updatesPerTick" type="number" min="1" value="5" /></div>
      <div class="field"><label for="snapshotTopic">snapshotTopic (listener)</label>
        <input id="snapshotTopic" name="snapshotTopic" class="wide" placeholder="/snapshot/positions/{clientId}" disabled /></div>
      <div class="field"><label for="triggerTopic">triggerTopic</label>
        <input id="triggerTopic" name="triggerTopic" class="wide" placeholder="{snapshotTopic}/{rate}/{batchSize}" disabled /></div>
      <div class="field"><label for="snapshotEndToken">snapshotEndToken</label>
        <input id="snapshotEndToken" name="snapshotEndToken" placeholder="Success" disabled /></div>
      <div class="field"><label for="keyColumn">keyColumn</label>
        <input id="keyColumn" name="keyColumn" placeholder="positionId" disabled /></div>
      <div class="field"><label for="label">label</label>
        <input id="label" name="label" value="Playground" /></div>
      <div class="field"><label for="filter">filter (JSON triples, optional)</label>
        <input id="filter" name="filter" class="filter" placeholder='[["desk","==","FX Spot"]]' /></div>
      <button type="submit">Apply</button>
    </form>
    <div class="status" id="status"></div>
    <div id="grid"></div>
    <script type="module" src="/src/playground.ts"></script>
  </body>
</html>
