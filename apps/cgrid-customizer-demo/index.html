<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cgrid · Customizer Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" data-theme="dark">
      <header>
        <h1>cgrid — Customizer Demo</h1>
        <div class="actions">
          <div class="layouts-control" role="group" aria-label="Layouts">
            <span class="cluster-label">Layout</span>
            <select id="layout-select" data-testid="layout-select" aria-label="Active layout"></select>
            <button id="layout-save" data-testid="layout-save" title="Save the current view as a new layout">Save</button>
            <button id="layout-delete" data-testid="layout-delete" title="Delete the selected layout">Delete</button>
            <button id="layout-export" data-testid="layout-export" title="Export all layouts to a JSON file">Export</button>
            <button id="layout-import" data-testid="layout-import" title="Import layouts from a JSON file">Import</button>
            <input type="file" id="layout-file" data-testid="layout-file" accept="application/json,.json" hidden />
          </div>
          <div class="layouts-control templates-control" role="group" aria-label="Styling templates">
            <span class="cluster-label">Templates</span>
            <button id="tpl-apply" data-testid="tpl-apply" title="Save a currency template and apply it to Notional + Mkt Value — one template, reused across columns">Apply $</button>
            <button id="tpl-edit" data-testid="tpl-edit" title="Edit the Yield column's format — auto-creates the column's own template">Edit Yield</button>
            <button id="tpl-calc" data-testid="tpl-calc" title="Add a calculated column styled by the $ template — calc columns stay non-editable">Calc col</button>
            <span class="cluster-readout" data-testid="tpl-count">0 templates</span>
          </div>
          <div class="layouts-control rules-control" role="group" aria-label="Conditional rules">
            <span class="cluster-label">Rules</span>
            <button id="rule-loss" data-testid="rule-loss" title="Flag negative P&amp;L cells red — a cell-target conditional rule">Flag losses</button>
            <button id="rule-row" data-testid="rule-row" title="Tint the whole row for large positions — a row-target conditional rule">Big rows</button>
            <button id="rule-clear" data-testid="rule-clear" title="Remove all conditional rules from the active layout">Clear</button>
            <span class="cluster-readout" data-testid="rule-count">0 rules</span>
          </div>
          <button id="theme" data-testid="btn-theme">Light theme</button>
          <button id="reset-state" data-testid="btn-reset-state">Reset saved state</button>
          <label class="demo-switch"><input type="checkbox" id="live-updates" data-testid="sw-live" checked /> Live updates</label>
          <label class="demo-switch"><input type="checkbox" id="editable" data-testid="sw-editable" checked /> Editable</label>
          <span class="status-pill" data-testid="status-pill">
            <span data-testid="status-phase">connecting…</span>
            <span class="status-sep">·</span>
            <span data-testid="status-rows">Rows: —</span>
            <span class="status-sep">·</span>
            <span data-testid="status-ups">0 upd/s</span>
          </span>
        </div>
      </header>
      <div id="grid" class="grid-host"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
