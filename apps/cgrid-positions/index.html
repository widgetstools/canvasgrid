<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cgrid · STOMP Positions</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>cgrid — STOMP Positions</h1>
        <div class="actions">
          <button id="theme">Toggle theme</button>
          <button id="save-layout">Save layout</button>
          <button id="restore-layout">Restore layout</button>
          <button id="reset-layout">Reset layout</button>
          <button id="fit-columns">Fit columns</button>
          <button id="autosize-all">Autosize all</button>
          <button id="imp-hide-pnl">Hide P&amp;L</button>
          <button id="imp-pin-spread">Pin Spread Left</button>
          <button id="imp-reset-widths">Reset widths</button>
          <input
            id="quick-filter"
            type="search"
            placeholder="Search..."
            autocomplete="off"
            data-testid="quick-filter"
          />
          <label class="toolbar-checkbox" for="ext-positive-pnl">
            <input
              id="ext-positive-pnl"
              type="checkbox"
              data-testid="ext-positive-pnl"
            />
            Positive P&amp;L only
          </label>
          <label class="toolbar-checkbox" for="pin-selected-top">
            <input
              id="pin-selected-top"
              type="checkbox"
              data-testid="pin-selected-top"
            />
            Pin selected to top
          </label>
          <span class="toolbar-divider" aria-hidden="true">|</span>
          <label class="toolbar-checkbox" for="toggle-pinning">
            <input id="toggle-pinning" type="checkbox" data-testid="toggle-pinning" />
            Pinned cols
          </label>
          <label class="toolbar-checkbox" for="toggle-column-groups">
            <input id="toggle-column-groups" type="checkbox" data-testid="toggle-column-groups" />
            Column groups
          </label>
          <label class="toolbar-checkbox" for="toggle-row-group-panel">
            <input id="toggle-row-group-panel" type="checkbox" data-testid="toggle-row-group-panel" />
            Row group panel
          </label>
          <label class="toolbar-checkbox" for="toggle-open-columns">
            <input id="toggle-open-columns" type="checkbox" data-testid="toggle-open-columns" />
            Columns panel
          </label>
          <label class="toolbar-checkbox" for="clipboard-delimiter">
            Clipboard:
            <select id="clipboard-delimiter" data-testid="clipboard-delimiter">
              <option value="tab" selected>TSV (tab)</option>
              <option value=",">CSV (comma)</option>
              <option value=";">SSV (semicolon)</option>
              <option value="|">Pipe</option>
            </select>
          </label>
          <span class="status-pill" data-testid="status-pill">
            <span data-testid="status-rows">Rows: —</span>
            <span class="status-sep">·</span>
            <span data-testid="status-ups">Updates/s: <span data-testid="status-ups-processed">0</span></span>
            <span class="status-faint">of</span>
            <span data-testid="status-ups-published">0</span>
            <span class="status-faint">published</span>
          </span>
        </div>
      </header>
      <div id="grid" class="grid-host vg-theme-cursor-dark"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
